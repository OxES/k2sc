[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "k2sc"
dynamic = ["version"]
description = "Kepler/K2 and TESS light curve systematics correction with JAX Gaussian Processes."
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.11"
authors = [
    {name = "Suzanne Aigrain"},
    {name = "Hannu Parviainen"},
    {name = "Benjamin Pope"},
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "astropy>=5.3",
    "jax>=0.4.35",
    "jaxlib>=0.4.35",
    "tinygp>=0.3.0",
    "equinox>=0.11.5",
    "matplotlib>=3.8",
    "tqdm>=4.65",
]

[project.optional-dependencies]
lightkurve = ["lightkurve>=2.4"]
mpi = ["mpi4py>=3.1"]
optimistix = ["optimistix>=0.0.7"]
aux = ["pandas>=2.0", "tables>=3.9"]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "lightkurve>=2.4",
    "optimistix>=0.0.7",
]
all = ["k2sc[lightkurve,mpi,optimistix,aux]"]

[project.scripts]
k2sc = "k2sc.cli:main"
k2plot = "k2sc.cli:main_plot"
k2ginfo = "k2sc.cli:main_ginfo"
k2mastify = "k2sc.cli:main_mastify"

[tool.setuptools]
packages = ["k2sc"]
package-dir = {"k2sc" = "src"}

[tool.setuptools.dynamic]
version = {attr = "k2sc.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests/unit_tests"]
addopts = "-ra"
